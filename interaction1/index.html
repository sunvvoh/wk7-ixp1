<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Shop - Narrative 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            background-color: #ffffff;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        #money-counter {
            position: absolute;
            top: 5px;
            right: 10px;
            width: 300px;
            height: 180px;
            background-image: url('assets/money.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #2d5016;
        }

        #round-counter-container {
            position: absolute;
            top: 265px;
            right: 10px;
            width: 300px;
            height: 180px;
            z-index: 1000;
        }

        #round-counter {
            width: 300px;
            height: 180px;
            background-image: url('assets/money.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #2d5016;
            position: relative;
        }

        #cat-icon {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background-image: url('assets/cat neutral.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #taco-truck {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background-image: url('assets/taco truck.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center bottom;
            z-index: 1;
        }

        #speech-bubble {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            max-width: 600px;
            text-align: center;
            display: none;
            z-index: 10;
            color: #333;
        }

        #cat-sprite {
            position: absolute;
            top: 20%;
            width: 300px;
            height: 300px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: all 0.3s ease;
            z-index: 5;
        }

        #input-container {
            position: absolute;
            bottom: -550px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
            width: 500px;
            height: 550px;
            background-image: url('assets/notepad.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        #input-container.slide-up {
            animation: slideUpFromBottom 0.67s forwards;
        }

        #input-container.slide-down {
            animation: slideDownOffScreen 0.67s forwards;
        }

        @keyframes slideUpFromBottom {
            from {
                bottom: -550px;
            }
            to {
                bottom: 0px;
            }
        }

        @keyframes slideDownOffScreen {
            from {
                bottom: 0px;
            }
            to {
                bottom: -550px;
            }
        }

        #order-input {
            font-size: 20px;
            padding: 20px 30px 20px 60px;
            width: 320px;
            height: 150px;
            margin-top: 80px;
            margin-left: -20px;
            border: none;
            background: transparent;
            text-align: left;
            color: #333;
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            caret-color: transparent;
            outline: none;
            resize: none;
            overflow: hidden;
            word-wrap: break-word;
        }

        #writing-hand {
            position: absolute;
            width: 350px;
            height: 350px;
            background-image: url('assets/user typing.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: top left;
            pointer-events: none;
            display: none;
            z-index: 15;
            bottom: -550px;
        }

        #writing-hand.slide-up {
            animation: slideUpFromBottom 0.67s forwards;
        }

        #writing-hand.slide-down {
            animation: slideDownOffScreen 0.67s forwards;
        }

        #countertop {
            position: absolute;
            top: 45%;
            bottom: 0;
            left: 0;
            width: 100%;
            background-image: url('assets/countertop.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 4;
        }

        #submit-button {
            width: 350px;
            height: 150px;
            background-image: url('assets/submit.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            margin-top: 100px;
            transition: transform 0.2s;
            background-color: transparent;
        }

        #submit-button:hover {
            transform: scale(1.1);
        }

        #submit-button:active {
            transform: scale(0.95);
        }

        #ingredients-container {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: row;
            gap: 30px;
            align-items: center;
            z-index: 10;
        }

        .ingredient-option {
            width: 150px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: grab;
            transition: transform 0.2s, filter 0.2s;
        }

        .ingredient-option:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .ingredient-option:active {
            cursor: grabbing;
        }

        #tortilla {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            border: 3px dashed transparent;
            transition: border-color 0.3s;
            z-index: 10;
        }

        #tortilla.drag-over {
            border-color: #4CAF50;
        }

        .placed-ingredient {
            position: absolute;
            width: 120px;
            height: 120px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            z-index: 11;
        }

        #takeout {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 250px;
            background-image: url('assets/takeout.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: none;
            z-index: 12;
        }

        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #2d5016;
            text-align: center;
            display: none;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 50px 80px;
            border: 3px solid #333;
        }

        .slide-out-left {
            animation: slideOutLeft 1s forwards;
        }

        @keyframes slideOutLeft {
            to {
                transform: translateX(-150%);
                opacity: 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .money-toast {
            position: absolute;
            font-size: 36px;
            font-weight: bold;
            color: #4CAF50;
            z-index: 100;
            pointer-events: none;
            animation: jumpAndFade 1.5s forwards;
        }

        @keyframes jumpAndFade {
            0% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -80px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120px);
            }
        }

        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #title-screen.hidden {
            display: none;
        }

        #title-image {
            width: 900px;
            max-width: 90%;
            height: auto;
            margin-bottom: 50px;
            background-image: url('assets/title.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            aspect-ratio: 16 / 9;
        }

        #start-button {
            width: 500px;
            height: 180px;
            background-image: url('assets/start button.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #start-button:hover {
            transform: scale(1.1);
        }

        #start-button:active {
            transform: scale(0.95);
        }

        /* After Hours Screen */
        #after-hours-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: none;
            opacity: 0;
            z-index: 2000;
            transition: opacity 1s;
        }

        #after-hours-screen.fade-in {
            opacity: 1;
        }

        #after-hours-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/after hours.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        #day-complete-text {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 72px;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        #after-hours-buttons {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
        }

        #upgrade-button, #next-day-button {
            width: 400px;
            height: 150px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            background-color: transparent;
        }

        #upgrade-button {
            background-image: url('assets/upgrade after hours.png');
        }

        #next-day-button {
            background-image: url('assets/next day after hours.png');
        }

        #upgrade-button:hover, #next-day-button:hover {
            transform: scale(1.05);
        }

        /* Upgrade Screen */
        #upgrade-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0d1b2e;
            display: none;
            z-index: 3000;
        }

        #back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 250px;
            height: 150px;
            background-image: url('assets/money.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #back-button span {
            font-size: 32px;
            font-weight: bold;
            color: #2d5016;
        }

        #back-button:hover {
            transform: scale(1.05);
        }

        #upgrade-money-display {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 250px;
            height: 150px;
            background-image: url('assets/money.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #2d5016;
        }

        #upgrade-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }

        .upgrade-item {
            background-color: rgba(128, 128, 128, 0.5);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 250px;
        }

        .upgrade-header {
            font-size: 28px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        .upgrade-image-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upgrade-item-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .upgrade-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .minus-btn, .plus-btn {
            width: 50px;
            height: 50px;
            font-size: 32px;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .minus-btn:hover, .plus-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .upgrade-count {
            font-size: 36px;
            font-weight: bold;
            color: white;
            min-width: 40px;
        }

        #receipt-container {
            position: relative;
            width: 400px;
            height: 500px;
        }

        #receipt-bg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #receipt-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            padding: 40px 20px;
        }

        .receipt-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 20px;
            color: #333;
        }

        .receipt-line.total-line {
            border-top: 2px solid #333;
            padding-top: 20px;
            margin-top: 30px;
            font-weight: bold;
            font-size: 24px;
        }

        #buy-button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 150px;
            background-image: url('assets/buy.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            background-color: transparent;
        }

        #buy-button:hover {
            transform: translateX(-50%) scale(1.05);
        }

        /* Fade animations */
        .fade-out {
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="title-screen">
        <div id="title-image"></div>
        <div id="start-button"></div>
    </div>

    <div id="money-counter">$0.00</div>
    <div id="round-counter-container">
        <div id="round-counter">
            <div id="cat-icon"></div>
            <span id="round-text">1/3</span>
        </div>
    </div>

    <div id="game-container">
        <div id="taco-truck"></div>
        <div id="countertop"></div>
        <div id="speech-bubble"></div>
        <div id="cat-sprite"></div>

        <div id="input-container">
            <textarea id="order-input" placeholder=""></textarea>
            <button id="submit-button"></button>
        </div>

        <div id="writing-hand"></div>

        <div id="ingredients-container"></div>
        <div id="tortilla"></div>
        <div id="takeout"></div>
        <div id="final-message"></div>
    </div>

    <!-- After Hours Screen -->
    <div id="after-hours-screen">
        <div id="after-hours-bg"></div>
        <div id="day-complete-text">Day 1 complete!</div>
        <div id="after-hours-buttons">
            <button id="upgrade-button"></button>
            <button id="next-day-button"></button>
        </div>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-screen">
        <div id="back-button">
            <span>back</span>
        </div>
        <div id="upgrade-money-display">$0.00</div>

        <div id="upgrade-content">
            <div class="upgrade-item">
                <div class="upgrade-header">Table (max: 2)</div>
                <div class="upgrade-image-container">
                    <img src="assets/table.png" alt="Table" class="upgrade-item-image">
                </div>
                <div class="upgrade-controls">
                    <button class="minus-btn" data-item="table">-</button>
                    <span class="upgrade-count" id="table-count">0</span>
                    <button class="plus-btn" data-item="table">+</button>
                </div>
            </div>

            <div class="upgrade-item">
                <div class="upgrade-header">Plant (max: 2)</div>
                <div class="upgrade-image-container">
                    <img src="assets/plant.png" alt="Plant" class="upgrade-item-image">
                </div>
                <div class="upgrade-controls">
                    <button class="minus-btn" data-item="plant">-</button>
                    <span class="upgrade-count" id="plant-count">0</span>
                    <button class="plus-btn" data-item="plant">+</button>
                </div>
            </div>

            <div id="receipt-container">
                <img src="assets/blank receipt.png" alt="Receipt" id="receipt-bg">
                <div id="receipt-content">
                    <div class="receipt-line">
                        <span>Table x <span id="receipt-table-count">0</span></span>
                        <span id="receipt-table-cost">$0.00</span>
                    </div>
                    <div class="receipt-line">
                        <span>Plant x <span id="receipt-plant-count">0</span></span>
                        <span id="receipt-plant-cost">$0.00</span>
                    </div>
                    <div class="receipt-line total-line">
                        <span>Total</span>
                        <span id="receipt-total">$0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="buy-button"></button>
    </div>

    <script>
        // Game State
        let totalMoney = 0;
        let currentDay = 1;
        let currentRound = 0;
        let correctnessValue = 0;
        let currentOrder = {};
        let currentPhase = 'ordering'; // ordering, protein, vegetable, sauce
        let selectedIngredient = null;

        // Upgrade State
        let tablesOwned = 0;
        let plantsOwned = 0;
        const MAX_TABLES = 2;
        const MAX_PLANTS = 2;
        const TABLE_COST = 50;
        const PLANT_COST = 25;
        const TABLE_BONUS = 10;
        const PLANT_MULTIPLIER = 0.05; // 5% per plant
        const GOAL_MONEY = 1000;
        const TOTAL_DAYS = 7;

        // Game Data
        const proteins = ['beef', 'pork', 'chicken'];
        const vegetables = ['cilantro', 'onions'];
        const sauces = ['salsa verde', 'salsa roja'];

        const catExpressions = {
            '-2': 'assets/cat saddest.png',
            '-1': 'assets/cat sad.png',
            '0': 'assets/cat neutral.png',
            '1': 'assets/cat happy.png',
            '2': 'assets/cat happiest.png',
            'talking': 'assets/cat talking.png'
        };

        const ingredientImages = {
            'beef': 'assets/beef.png',
            'pork': 'assets/pork.png',
            'chicken': 'assets/chicken.png',
            'cilantro': 'assets/cilantro.png',
            'onions': 'assets/onions.png',
            'salsa verde': 'assets/salsa verde.png',
            'salsa roja': 'assets/salsa roja.png',
            'tortilla': 'assets/tortilla.png'
        };

        // DOM Elements
        const catSprite = document.getElementById('cat-sprite');
        const speechBubble = document.getElementById('speech-bubble');
        const inputContainer = document.getElementById('input-container');
        const orderInput = document.getElementById('order-input');
        const submitButton = document.getElementById('submit-button');
        const writingHand = document.getElementById('writing-hand');
        const ingredientsContainer = document.getElementById('ingredients-container');
        const tortilla = document.getElementById('tortilla');
        const takeout = document.getElementById('takeout');
        const moneyCounter = document.getElementById('money-counter');
        const roundText = document.getElementById('round-text');
        const finalMessage = document.getElementById('final-message');

        // Initialize Game
        function startGame() {
            currentRound = 0;
            totalMoney = 0;
            updateMoneyDisplay();
            roundText.textContent = '0/3';
            startNewRound();
        }

        function startNewRound() {
            currentRound++;
            correctnessValue = 0;
            currentPhase = 'ordering';
            roundText.textContent = `${currentRound}/3`;

            // Reset UI
            speechBubble.style.display = 'none';
            inputContainer.style.display = 'none';
            inputContainer.classList.remove('slide-up');
            inputContainer.style.bottom = '-550px'; // Reset position for next animation
            writingHand.style.display = 'none';
            writingHand.classList.remove('slide-up', 'slide-down');
            writingHand.style.removeProperty('left');
            writingHand.style.removeProperty('top');
            writingHand.style.bottom = '-550px'; // Reset position for next animation
            ingredientsContainer.style.display = 'none';
            tortilla.style.display = 'none';
            orderInput.value = '';

            // Clear any placed ingredients
            document.querySelectorAll('.placed-ingredient').forEach(el => el.remove());

            // Generate random order
            currentOrder = {
                protein: proteins[Math.floor(Math.random() * proteins.length)],
                vegetable: vegetables[Math.floor(Math.random() * vegetables.length)],
                sauce: sauces[Math.floor(Math.random() * sauces.length)]
            };

            // Show cat and start typing
            updateCatExpression(0);
            setTimeout(() => {
                typeOrderText();
            }, 500);
        }

        function updateCatExpression(value) {
            catSprite.style.backgroundImage = `url('${catExpressions[value.toString()]}')`;
        }

        function typeOrderText() {
            const orderText = `I want the <b>${currentOrder.protein}</b>, <b>${currentOrder.vegetable}</b>, and <b>${currentOrder.sauce}</b> <b>taco</b>`;
            catSprite.style.backgroundImage = `url('${catExpressions.talking}')`;
            speechBubble.style.display = 'block';
            speechBubble.innerHTML = '';

            let currentHTML = '';
            let plainText = orderText.replace(/<\/?b>/g, ''); // Get plain text version for timing
            let index = 0;

            const typingInterval = setInterval(() => {
                if (index < plainText.length) {
                    index++;
                    // Build HTML progressively
                    let tempText = '';
                    let htmlIndex = 0;
                    let charCount = 0;
                    let inTag = false;

                    while (charCount < index && htmlIndex < orderText.length) {
                        if (orderText[htmlIndex] === '<') {
                            inTag = true;
                        }
                        tempText += orderText[htmlIndex];
                        if (orderText[htmlIndex] === '>') {
                            inTag = false;
                        }
                        if (!inTag && orderText[htmlIndex] !== '<' && orderText[htmlIndex] !== '>') {
                            charCount++;
                        }
                        htmlIndex++;
                    }

                    speechBubble.innerHTML = tempText;
                } else {
                    clearInterval(typingInterval);
                    setTimeout(() => {
                        updateCatExpression(0);
                        showInputBox();
                    }, 2000);
                }
            }, 50);
        }

        function showInputBox() {
            speechBubble.style.display = 'none';
            inputContainer.style.display = 'flex';
            inputContainer.classList.add('slide-up');

            // Animate writing hand with notepad
            writingHand.style.display = 'block';
            writingHand.classList.add('slide-up');

            // After animation completes, switch to caret tracking mode
            setTimeout(() => {
                writingHand.classList.remove('slide-up');
                // Don't set bottom to 'auto' - leave it at 0px from animation
                // This allows top/left to position it for caret tracking
                // but bottom stays at 0px for the slide-down animation
                updateWritingHandPosition();
                orderInput.focus();
            }, 700); // Show after slide-up animation completes
        }

        function updateWritingHandPosition() {
            const inputRect = orderInput.getBoundingClientRect();
            const caretPos = orderInput.selectionStart;

            // Create a mirror div to calculate exact caret position
            const mirror = document.createElement('div');
            const style = window.getComputedStyle(orderInput);

            // Copy all relevant styles
            mirror.style.position = 'absolute';
            mirror.style.visibility = 'hidden';
            mirror.style.whiteSpace = 'pre-wrap';
            mirror.style.wordWrap = 'break-word';
            mirror.style.width = style.width;
            mirror.style.font = style.font;
            mirror.style.padding = style.padding;
            mirror.style.border = style.border;
            mirror.style.boxSizing = style.boxSizing;

            // Add text up to caret position
            const textBeforeCaret = orderInput.value.substring(0, caretPos);
            mirror.textContent = textBeforeCaret;

            // Add a span at caret position to measure
            const caretSpan = document.createElement('span');
            caretSpan.textContent = '|';
            mirror.appendChild(caretSpan);

            // Add to document to measure
            document.body.appendChild(mirror);

            // Get caret span position relative to mirror
            const caretSpanRect = caretSpan.getBoundingClientRect();
            const mirrorRect = mirror.getBoundingClientRect();

            // Calculate offsets
            const caretOffsetX = caretSpanRect.left - mirrorRect.left;
            const caretOffsetY = caretSpanRect.top - mirrorRect.top;

            // Remove mirror
            document.body.removeChild(mirror);

            // Calculate absolute position
            const caretX = inputRect.left + caretOffsetX;
            const caretY = inputRect.top + caretOffsetY;

            // Position the hand (offset left by 30px, up by 60px)
            writingHand.style.left = (caretX - 30) + 'px';
            writingHand.style.top = (caretY - 60) + 'px';
        }

        function getTextWidth(text, element) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const style = window.getComputedStyle(element);
            context.font = style.font;
            return context.measureText(text).width;
        }

        submitButton.addEventListener('click', checkOrder);
        orderInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkOrder();
        });

        // Update writing hand position as user types
        orderInput.addEventListener('input', updateWritingHandPosition);
        orderInput.addEventListener('click', updateWritingHandPosition);

        function checkOrder() {
            const userInput = orderInput.value.toLowerCase().trim();
            const correctOrder = `${currentOrder.protein} ${currentOrder.vegetable} ${currentOrder.sauce} taco`;

            if (userInput === correctOrder) {
                // Trigger slide-down animation for notepad
                inputContainer.classList.remove('slide-up');
                inputContainer.classList.add('slide-down');

                // Get current computed position of writing hand
                const currentTop = writingHand.getBoundingClientRect().top;

                // Set absolute pixel position to maintain current location
                writingHand.style.top = currentTop + 'px';
                writingHand.style.removeProperty('left');

                // Add transition for smooth animation
                writingHand.style.transition = 'top 0.67s ease';

                // Animate to off-screen after a brief delay
                setTimeout(() => {
                    writingHand.style.top = '100vh';
                }, 10);

                // Wait for animation to complete before starting ingredient phase
                setTimeout(() => {
                    inputContainer.style.display = 'none';
                    inputContainer.classList.remove('slide-down');
                    writingHand.style.display = 'none';
                    writingHand.style.transition = '';
                    startIngredientPhase('protein');
                }, 670); // Match animation duration
            } else {
                // Show order again
                orderInput.value = '';
                typeOrderText();
            }
        }

        function startIngredientPhase(phase) {
            currentPhase = phase;
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.style.display = 'flex';
            tortilla.style.display = 'block';
            tortilla.style.backgroundImage = `url('${ingredientImages.tortilla}')`;

            let options = [];
            if (phase === 'protein') options = proteins;
            else if (phase === 'vegetable') options = vegetables;
            else if (phase === 'sauce') options = sauces;

            options.forEach(option => {
                const ingredientDiv = document.createElement('div');
                ingredientDiv.className = 'ingredient-option';
                ingredientDiv.style.backgroundImage = `url('${ingredientImages[option]}')`;
                ingredientDiv.draggable = true;
                ingredientDiv.dataset.ingredient = option;

                ingredientDiv.addEventListener('dragstart', handleDragStart);
                ingredientsContainer.appendChild(ingredientDiv);
            });
        }

        function handleDragStart(e) {
            selectedIngredient = e.target.dataset.ingredient;
            e.dataTransfer.effectAllowed = 'move';
        }

        tortilla.addEventListener('dragover', (e) => {
            e.preventDefault();
            tortilla.classList.add('drag-over');
        });

        tortilla.addEventListener('dragleave', () => {
            tortilla.classList.remove('drag-over');
        });

        tortilla.addEventListener('drop', (e) => {
            e.preventDefault();
            tortilla.classList.remove('drag-over');

            if (selectedIngredient) {
                handleIngredientSelection(selectedIngredient);
            }
        });

        function handleIngredientSelection(ingredient) {
            // Check if correct
            const isCorrect = ingredient === currentOrder[currentPhase];

            if (isCorrect) {
                correctnessValue++;
            } else {
                correctnessValue--;
            }

            // Clamp between -2 and 2
            correctnessValue = Math.max(-2, Math.min(2, correctnessValue));

            // Update cat expression
            updateCatExpression(correctnessValue);

            // Place ingredient on tortilla in different positions
            const placedIngredient = document.createElement('div');
            placedIngredient.className = 'placed-ingredient';
            placedIngredient.style.backgroundImage = `url('${ingredientImages[ingredient]}')`;
            placedIngredient.style.bottom = '8%';

            // Position based on phase so ingredients overlap within tortilla
            if (currentPhase === 'protein') {
                placedIngredient.style.left = '47%';
            } else if (currentPhase === 'vegetable') {
                placedIngredient.style.left = '50%';
            } else if (currentPhase === 'sauce') {
                placedIngredient.style.left = '53%';
            }

            placedIngredient.style.transform = 'translateX(-50%)';
            document.getElementById('game-container').appendChild(placedIngredient);

            // Hide current ingredients
            ingredientsContainer.style.display = 'none';

            // Move to next phase
            setTimeout(() => {
                if (currentPhase === 'protein') {
                    startIngredientPhase('vegetable');
                } else if (currentPhase === 'vegetable') {
                    startIngredientPhase('sauce');
                } else if (currentPhase === 'sauce') {
                    finishRound();
                }
            }, 1000);
        }

        function finishRound() {
            // Calculate money earned
            let moneyEarned = 0;
            if (correctnessValue === 2) {
                moneyEarned = Math.random() * 4 + 6; // $6-$10
            } else if (correctnessValue === 1) {
                moneyEarned = Math.random() * 3 + 3; // $3-$6
            } else if (correctnessValue === 0) {
                moneyEarned = Math.random() * 2 + 1; // $1-$3
            } else if (correctnessValue === -1) {
                moneyEarned = Math.random() * 0.9 + 0.1; // $0.10-$1
            } else if (correctnessValue === -2) {
                moneyEarned = 0; // $0
            }

            // Replace taco with takeout image
            tortilla.style.display = 'none';
            document.querySelectorAll('.placed-ingredient').forEach(el => {
                el.style.display = 'none';
            });
            takeout.style.display = 'block';

            // Small delay before showing payment
            setTimeout(() => {
                totalMoney += moneyEarned;
                updateMoneyDisplay();

                // Show money toast above cat
                showMoneyToast(moneyEarned);

                // Animate cat and takeout leaving
                setTimeout(() => {
                    catSprite.classList.add('slide-out-left');
                    takeout.classList.add('slide-out-left');

                    setTimeout(() => {
                        catSprite.classList.remove('slide-out-left');
                        takeout.classList.remove('slide-out-left');
                        takeout.style.display = 'none';

                        if (currentRound < 3) {
                            startNewRound();
                        } else {
                            showFinalResult();
                        }
                    }, 1000);
                }, 1500);
            }, 300);
        }

        function updateMoneyDisplay() {
            moneyCounter.textContent = `$${totalMoney.toFixed(2)}`;
        }

        function showMoneyToast(amount) {
            const toast = document.createElement('div');
            toast.className = 'money-toast';
            toast.textContent = `+$${amount.toFixed(2)}`;

            // Position above cat
            const catRect = catSprite.getBoundingClientRect();
            toast.style.top = catRect.top + 'px';
            toast.style.left = (catRect.left + catRect.width / 2) + 'px';

            document.body.appendChild(toast);

            // Remove after animation completes
            setTimeout(() => {
                toast.remove();
            }, 1500);
        }

        function showFinalResult() {
            ingredientsContainer.style.display = 'none';
            tortilla.style.display = 'none';
            catSprite.style.display = 'none';

            // Post-day interaction will be added here later
            finalMessage.textContent = 'Day complete!';
            finalMessage.style.display = 'block';
            finalMessage.classList.add('fade-in');
        }

        // Title screen handling
        const titleScreen = document.getElementById('title-screen');
        const startButton = document.getElementById('start-button');

        startButton.addEventListener('click', () => {
            titleScreen.classList.add('hidden');
            startGame();
        });
    </script>
</body>
